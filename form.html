<main>

<hr>

<h1>Form Pendaftaran Akun</h1>

<form action="#" method="post">
  <fieldset>
    <legend>Daftar Akun</legend>

    <p>
      <label for="nama">Nama Lengkap:</label><br>
      <input type="text" id="nama" name="nama">
    </p>

    <p>
      Jenis Kelamin:<br>
      <label for="lakilaki">
        <input type="radio" id="lakilaki" name="jenis_kelamin" value="Laki-Laki">
        Laki-Laki
      </label>
      <label for="perempuan">
        <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
        Perempuan
      </label>
    </p>

    <p>
      <label for="tempat_lahir">Tempat Lahir:</label><br>
      <input type="text" id="tempat_lahir" name="tempat_lahir">
    </p>

    <p>
      <label for="tanggal_lahir">Tanggal Lahir:</label><br>
      <input type="date" id="tanggal_lahir" name="tanggal_lahir">
    </p>

    <p>
      <label for="agama">Agama:</label><br>
      <select id="agama" name="agama">
        <option value="islam">Islam</option>
        <option value="katolik">Katolik</option>
        <option value="protestan">Protestan</option>
        <option value="hindu">Hindu</option>
        <option value="buddha">Buddha</option>
        <option value="konghucu">Konghucu</option>
      </select>
    </p>

    <p>
      Hobi:<br>
      <label for="olahraga">
        <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
        Olahraga
      </label>
      <label for="membaca">
        <input type="checkbox" id="membaca" name="hobi" value="Membaca">
        Membaca
      </label>
      <label for="ngoding">
        <input type="checkbox" id="ngoding" name="hobi" value="Ngoding">
        Ngoding
      </label>
    </p>

    <p>
      <label for="password">Password:</label><br>
      <input type="password" id="password" name="password">
    </p>

    <p>
      <label for="persetujuan">
        <input type="checkbox" id="persetujuan" name="persetujuan" value="setuju">
        Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.
      </label>
    </p>

    <p>
      <input type="reset" value="Reset">
      <input type="submit" value="Submit">
    </p>

  </fieldset>
</form>

</main>

</body>
</html>
